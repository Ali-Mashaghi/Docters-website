{% extends "base.html" %}

{% block title %}ورود — پنل مدیریت{% endblock %}

{% block content %}
<section class="auth-container">
    <div class="auth-card glass-strong">
        <h1>ورود به پنل</h1>
        <p>برای دسترسی به داشبورد مدیریت وارد شوید</p>

        {% if form.errors %}
        <div class="alert alert-error">نام کاربری یا رمز عبور اشتباه است.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">نام کاربری</label>
                <input type="text" name="username" id="id_username" class="glass-input" required autofocus dir="ltr">
            </div>
            <div class="form-group">
                <label for="id_password">رمز عبور</label>
                <input type="password" name="password" id="id_password" class="glass-input" required dir="ltr">
            </div>
            <button type="submit" class="btn btn-primary btn-block">ورود</button>
        </form>
    </div>
</section>
{% endblock %}
